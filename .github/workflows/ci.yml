name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter and formatting checks
        if: runner.os == 'Linux'
        run: pnpm lint

      - name: Run type checking
        if: runner.os == 'Linux'
        run: pnpm typecheck

      - name: Run tests with coverage
        if: runner.os == 'Linux'
        run: pnpm test:coverage

      - name: Run tests
        if: runner.os != 'Linux'
        run: pnpm test

      - name: Build project
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: stats_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stats_store_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify database bootstrap and triggers
        run: bash scripts/test-database.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: stats_store_test
